<html lang="ar">
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
@font-face{font-family:"ArabicMain";font-weight:400;src:url("../../assets/fonts/noto-sans-arabic-arabic-400-normal.woff2") format("woff2");}
@font-face{font-family:"ArabicMain";font-weight:700;src:url("../../assets/fonts/noto-sans-arabic-arabic-700-normal.woff2") format("woff2");}
html,body{margin:0;padding:0;background:#222;}
#viewport{width:1920px;height:1080px;position:relative;overflow:hidden;font-family:"ArabicMain",sans-serif;
  font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;text-rendering:optimizeLegibility;}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;}
#stage svg{overflow:visible;}
.actor{position:absolute;}
.actor svg{display:block;}
#bg{position:absolute;left:0;top:0;}
#fx{position:absolute;left:0;top:0;pointer-events:none;}
#boardText{position:absolute;left:450px;top:230px;width:1020px;height:260px;display:flex;align-items:center;justify-content:center;
  direction:rtl;color:#1b1b1b;white-space:nowrap;}
#sentence{display:inline-flex;direction:rtl;align-items:center;font-size:128px;line-height:1.9;transform-origin:center;}
.word{display:inline-block;position:relative;padding:0 .17em;}
.tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:-18px;white-space:nowrap;font-size:48px;font-weight:700;
  color:#fff;background:var(--c,#1f6feb);border-radius:22px;padding:0 26px;line-height:1.7;opacity:0;}
.tag:before{content:"";position:absolute;left:50%;top:-12px;transform:translateX(-50%);border:12px solid transparent;border-top:0;border-bottom-color:var(--c,#1f6feb);}
#badge{position:absolute;left:1320px;top:128px;width:130px;height:130px;opacity:0;}
#quiz{position:absolute;left:450px;top:120px;width:1020px;height:500px;direction:rtl;display:none;}
#quiz .prompt{font-size:56px;line-height:1.5;text-align:center;color:#1b1b1b;margin-top:6px;}
#quiz .opts{display:flex;gap:26px;margin-top:30px;}
#quiz .opts.rows{flex-direction:column;}
#quiz .opts.row{flex-direction:row;margin-top:16px;}
#quiz .opt{display:flex;align-items:center;gap:24px;border:6px solid #cfd6e4;border-radius:30px;background:#f6f8fc;padding:0 28px;
  position:relative;transition:none;}
#quiz .rows .opt{height:140px;}
#quiz .prompt + .opts.rows{margin-top:14px;gap:18px;}
#quiz .prompt + .opts.rows .opt{height:108px;}
#quiz .prompt + .opts.rows .txt{font-size:60px;}
#quiz .prompt + .opts.rows .lab{width:64px;height:64px;font-size:44px;}
#quiz .row .opt{flex:1;height:170px;justify-content:center;flex-direction:column;gap:6px;padding:0 10px;}
#quiz .lab{flex:none;width:76px;height:76px;border-radius:50%;background:#1f6feb;color:#fff;font-size:52px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;}
#quiz .row .lab{width:56px;height:56px;font-size:40px;}
#quiz .txt{font-size:68px;line-height:1.5;color:#1b1b1b;}
#quiz .row .txt{font-size:60px;}
#quiz .ck{position:absolute;left:26px;top:50%;margin-top:-34px;width:68px;height:68px;opacity:0;}
#quiz .row .ck{left:12px;top:12px;margin-top:0;width:50px;height:50px;}
#quiz .opt.correct{border-color:#2ea44f;background:#e6f6ea;}
#quiz .opt.dim{opacity:.35;}
#quiz .cd{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;background:#ff9f1c;
  color:#fff;font-size:70px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;}
#caption{position:absolute;left:110px;width:1700px;bottom:10px;direction:rtl;text-align:center;background:rgba(18,24,44,.82);
  border-radius:28px;padding:2px 36px 4px;opacity:0;}
#capName{font-size:30px;color:#9fb3d9;line-height:1.35;}
#capText{font-size:66px;line-height:1.5;color:#fff;font-weight:400;}

#kids{position:absolute;left:450px;top:120px;width:1020px;height:500px;direction:rtl;pointer-events:none;overflow:visible;}
#kids .k{position:absolute;left:0;top:0;width:1020px;height:500px;display:flex;align-items:center;justify-content:center;direction:rtl;opacity:0;}
#kids .k.card .big{font-size:340px;line-height:1.25;color:#1b1b1b;font-weight:700;}
#kids .k.card .nm{position:absolute;top:18px;left:0;width:100%;text-align:center;font-size:54px;color:#1f6feb;font-weight:700;}
#kids .k.card.forms .big{font-size:150px;position:absolute;top:70px;left:0;width:100%;text-align:center;line-height:1.3;}
#kids .forms{position:absolute;left:0;bottom:24px;width:100%;display:flex;gap:18px;justify-content:center;direction:rtl;}
#kids .forms .fm{width:210px;height:190px;border:5px solid #cfd6e4;border-radius:24px;background:#f6f8fc;text-align:center;}
#kids .forms .fm b{display:block;font-size:100px;line-height:1.35;color:#1b1b1b;font-weight:700;}
#kids .forms .fm i{display:block;font-style:normal;font-size:30px;color:#5b6b8c;line-height:1.1;}
#kids .k.txt{flex-wrap:wrap;align-content:center;box-sizing:border-box;padding:0 30px;}
#kids .k.txt .w{display:inline-block;padding:0 .14em;font-size:var(--fs,150px);line-height:1.7;color:#1b1b1b;font-weight:700;white-space:nowrap;}

#kids .k.txt.side{justify-content:flex-start;padding-right:30px;box-sizing:border-box;width:700px;left:320px;}
#kids .k.txt.small{top:360px;height:120px;}
#kids .k.txt.small .w{font-size:var(--fs,72px);line-height:1.5;font-weight:400;}
#kids .k.txt.contrast .w{font-size:var(--fs,96px);}
#kids .hl{color:#e8590c;}
#kids .k.img{width:300px;left:40px;top:90px;height:320px;}
#kids .k.img .ph{width:280px;height:280px;border:6px dashed #9fb3d9;border-radius:30px;background:#eef3fb;display:flex;align-items:center;justify-content:center;

#kids .k.img img{width:290px;height:290px;object-fit:contain;border-radius:24px;background:#fff;}
#kids .k.cue{top:410px;height:84px;}

#fade{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;opacity:0;pointer-events:none;}

    <circle cx="90" cy="178" r="10" fill="#ff8fa3" opacity=".55"/><circle cx="170" cy="178" r="10" fill="#ff8fa3" opacity=".55"/>
    ${MOUTH(130,182,12)}
   </g>
  </g></svg>`
};
// تعبيرات الوجه: r رفع الحاجبين، t ميل (موجب = قلق/استغراب)، s ابتسامة (-1..1)، o فتح الفم الإضافي
const EMO = {
  "مرح":{r:5,t:0,s:.85,o:.05}, "حماس":{r:9,t:0,s:1,o:.2}, "فرح":{r:7,t:0,s:1,o:.1},
  "تشويق":{r:11,t:2,s:.6,o:.25}, "استغراب":{r:13,t:6,s:-.15,o:.45}, "متردد":{r:3,t:9,s:-.25,o:0},
  "تشجيع":{r:6,t:0,s:.95,o:.05}
};
const NEUTRAL = {r:0,t:0,s:.3,o:0};
const mixE = (a,b,w) => ({r:lerp(a.r,b.r,w), t:lerp(a.t,b.t,w), s:lerp(a.s,b.s,w), o:lerp(a.o,b.o,w)});
function exprAt(a,t){
  const ln = D.dialogue.find(d => t>=d.start-0.1 && t<d.end+0.4 && d.emotion && EMO[d.emotion]);
  if (!ln) return NEUTRAL;
  const w = Math.min(clamp((t-ln.start+0.1)/0.25), 1-clamp((t-ln.end)/0.4)) * (ln.character===a.id ? 1 : 0.4);
  return mixE(NEUTRAL, EMO[ln.emotion], w);
}
function mouthD(cx,cy,w,s,open){
  const y0 = cy - s*7, up = -2 + (s<0 ? -s*2 : 0), lo = 3 + open*20 + Math.max(s,0)*7;
  return `M${cx-w},${y0} Q${cx},${cy+up} ${cx+w},${y0} Q${cx},${cy+lo} ${cx-w},${y0}Z`;
}
const actors = D.actors.map(a => {
  const el = document.createElement("div"); el.className = "actor"; el.innerHTML = SVG[a.id];
  el.style.left = "2100px"; el.style.top = a.top+"px";
  $("actors").appendChild(el);
  const q = s => el.querySelector(s);
  return Object.assign({}, a, {el, mouth:q(".mouth"), eyes:q(".eyes"), pupils:el.querySelectorAll(".pupil"), head:q(".head"), browL:q(".browL"), browR:q(".browR"), armR:q(".armR"), armL:q(".armL"), body:q(".body"), glow:q(".glow"), cx:a.x, cy:a.top});
});
const AI = actors.find(a => a.id === "inna");

// ---------------- شرارات ----------------
const sparks = [];
if (AI){
  if (AI.enter > 0) for (let i=0;i<9;i++) sparks.push({t0:AI.enter+0.15+i*0.17, dur:0.8, kind:"trail", s:i, size:16+rnd(i+3)*12});
  D.board.forEach((b, idx) => { if (idx > 0) for (let i=0;i<14;i++) sparks.push({t0:b.start-0.5+i*0.05, dur:0.9, kind:"toWord", s:i+idx*20, size:20+rnd(i+idx)*16}); });
  for (let i=0;i<Math.floor(D.duration/0.92);i++) sparks.push({t0:1.5+i*0.92, dur:0.8, kind:"amb", s:i, size:12+rnd(i+9)*10});
}
const fx = $("fx");
sparks.forEach(sp => { const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",SPARK); p.setAttribute("fill","#ffd54a"); p.setAttribute("opacity","0"); fx.appendChild(p); sp.el = p; });
const castTimes = D.board.map(b => b.start).slice(1);

// ---------------- أدوات ----------------
const speakingId = t => { const d = D.dialogue.find(d => t>=d.start && t<d.end); return d ? d.character : null; };
const lineAt = t => D.dialogue.find(d => t>=d.start && t<d.end) || null;
let curBoard = null, curQuiz = null;

function buildBoard(b){
  const s = $("sentence"); s.innerHTML = "";
  b.text.split(" ").forEach(w => {
    const sp = document.createElement("span"); sp.className = "word"; sp.dataset.t = w;
    sp.appendChild(document.createTextNode(w));
    const tg = document.createElement("span"); tg.className = "tag"; sp.appendChild(tg);
    s.appendChild(sp);
  });
  s.style.fontSize = "128px";
  const w = s.getBoundingClientRect().width;
  if (w > 980) s.style.fontSize = (128*980/w)+"px";
}
const LETTERS = ["أ","ب","ج"], DIGITS = ["٠","١","٢","٣"];
const CHECK = '<svg class="ck" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#2ea44f"/><path d="M28,52 L44,68 L74,34" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
function buildQuiz(q){
  const el = $("quiz"); el.innerHTML = "";
  if (q.prompt){ const p = document.createElement("div"); p.className = "prompt"; p.textContent = q.prompt; el.appendChild(p); }
  const wrap = document.createElement("div"); wrap.className = "opts "+q.layout;
  const LAB = q.labels === "digits" ? DIGITS.slice(1) : LETTERS;   // أرقام حين تكون الخيارات حروفاً (كي لا يلتبس الترقيم بالجواب)
  q.options.forEach((o,i) => {
    const c = document.createElement("div"); c.className = "opt";
    c.innerHTML = '<span class="lab">'+LAB[i]+'</span><span class="txt"></span>'+CHECK;
    c.querySelector(".txt").textContent = o; wrap.appendChild(c);
  });
  el.appendChild(wrap);
  const cd = document.createElement("div"); cd.className = "cd"; el.appendChild(cd);
}


// ---- طبقة تعليم الحروف (letter_card / letter_highlight / cue / image / نص كبير) ----
const FORM_LABEL = {isolated:"مُنْفَصِل", initial:"أَوَّل", medial:"وَسَط", final:"آخِر"};
const CLUSTER_RE = /\p{L}\p{M}*/gu;
function clusterize(word){ return word.match(CLUSTER_RE) || []; }          // نفس تقسيم studio.letters.clusters للحروف
function wordEl(word, hlIdx){
  const w = document.createElement("span"); w.className = "w";
  const set = new Set(hlIdx || []);
  if (!set.size){ w.textContent = word; return w; }
  const parts = word.match(/\p{L}\p{M}*|[^\p{L}\p{M}]+/gu) || [];     // نحافظ على غير الحروف كما هي
  let li = 0;
  parts.forEach(pt => { const sp = document.createElement("span");
    if (/^\p{L}/u.test(pt)){ if (set.has(li)) sp.className = "hl"; li++; }
    sp.textContent = pt; w.appendChild(sp); });
  return w;
}
function buildKid(k){
  const el = document.createElement("div"); el.className = "k "+k.kind+(k.cls?" "+k.cls:""); el.dataset.start = k.start; el.dataset.end = k.end;
  if (k.kind === "card"){
    el.innerHTML = '<div class="nm"></div><div class="big"></div>';
    el.querySelector(".nm").textContent = k.name || ""; el.querySelector(".big").textContent = k.letter;
    if (k.showForms){ el.classList.add("forms"); const f = document.createElement("div"); f.className = "forms";
      ["isolated","initial","medial","final"].forEach(key => { if (!k.forms[key]) return;
        const d = document.createElement("div"); d.className = "fm"; d.innerHTML = "<b></b><i></i>";
        d.querySelector("b").textContent = k.forms[key]; d.querySelector("i").textContent = FORM_LABEL[key]; f.appendChild(d); });
      el.appendChild(f); el.querySelector(".nm").style.display = "none"; }
  } else if (k.kind === "txt"){
    const words = k.text.split(" ");
    const toks = (k.tokens || []);
    words.forEach((w, wi) => { const h = toks.find(x => x.token === wi); el.appendChild(wordEl(w, k.hl && !toks.length ? k.hl : (h ? h.cluster_indices : []))); });
  } else if (k.kind === "img"){
    if (k.src){ const im = document.createElement("img"); im.src = k.src; el.appendChild(im); }
    else { const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "[ image: " + k.concept + " ]"; el.appendChild(ph); }
  } else if (k.kind === "cue"){
    el.innerHTML = '<div class="pill"><span>🗣️</span><span></span></div>'; el.querySelector(".pill span:last-child").textContent = k.text;
  }
  return el;
}
function fitKid(e){            // يصغّر الخط إن زادت كلمة عن العرض أو زاد المحتوى عن ارتفاع السبورة (الجملة تلتف على أسطر)
  const avail = e.classList.contains("side") ? 640 : 960, top0 = $("kids").getBoundingClientRect().top;
  for (let guard = 0; guard < 14; guard++){
    const ws = [...e.querySelectorAll(".w")]; if (!ws.length) return;
    const rs = ws.map(w => w.getBoundingClientRect());
    const tooWide = rs.some(r => r.width > avail);
    const tooTall = Math.max(...rs.map(r => r.bottom)) - Math.min(...rs.map(r => r.top)) > 470;
    if (!tooWide && !tooTall) return;
    const cur = parseFloat(getComputedStyle(ws[0]).fontSize);
    e.style.setProperty("--fs", (cur*0.9)+"px");
  }
}
let curKidsKey = "";
function updateKids(t){
  const act = D.kids.filter(k => t>=k.start && t<k.end);
  const key = act.map(k => k.id).join(",");
  if (key !== curKidsKey){ curKidsKey = key; const root = $("kids"); root.innerHTML = ""; act.forEach(k => { const e = buildKid(k); e.dataset.id = k.id; root.appendChild(e); if (k.kind === "txt") fitKid(e); }); }
  $("kids").querySelectorAll(".k").forEach(e => { const k = act.find(x => String(x.id) === e.dataset.id); if (!k) return;
    const p = clamp((t-k.start)/0.3); e.style.opacity = Math.min(p, clamp((k.end-t)/0.2) );
    e.style.transform = "scale("+(0.94+0.06*easeOut(p))+")";
    if (k.kind === "cue") e.querySelector(".pill").style.transform = "scale("+(1+0.05*Math.sin(t*6))+")";
    const hl = e.querySelectorAll(".hl"); hl.forEach(h => h.style.opacity = clamp((t-k.start-0.4)/0.3) * 0.65 + 0.35);
  });
  return act;
}
window.auditAt = function(t){      // تدقيق بصري: عناصر طبقة الأطفال خارج حدود السبورة
  renderAt(t); const B = {l:450, t:120, r:1470, b:620}, bad = [];
  $("kids").querySelectorAll(".k").forEach(e => { const r = e.getBoundingClientRect();
    const inner = e.firstElementChild ? e.firstElementChild.getBoundingClientRect() : r;
    [r, inner].forEach(q => { if (q.width>0 && (q.left < B.l-2 || q.right > B.r+2 || q.top < B.t-2 || q.bottom > B.b+2)) bad.push({cls:e.className, rect:[q.left,q.top,q.right,q.bottom].map(Math.round)}); }); });
  return bad;
};

function renderAt(t){
  const sp = speakingId(t);
  const boardNow = D.board.filter(b => t>=b.start && t<b.end).pop() || null;
  const quizNow = D.quizzes.find(q => t>=q.start && t<q.end) || null;
  const kidsNow = updateKids(t);
  const casting = castTimes.some(c => t>=c-0.8 && t<c+0.9);

  // ---- الشخصيات ----
  actors.forEach(a => {
    let x = a.x, y = a.top;
    if (a.enter > 0){
      if (t < a.enter) x = 2100;
      else { const p = clamp((t-a.enter)/1.6); x = lerp(2100, a.x, easeOut(p));
             y = a.top - 80*Math.abs(Math.sin(p*Math.PI*3))*(1-p) + (p>=1 ? 4*Math.sin(t*2.4) : 0); }
    } else y = a.top + 3*Math.sin(t*2.2 + a.top);
    a.cx = x; a.cy = y; a.el.style.left = x+"px"; a.el.style.top = y+"px";
    const talk = sp === a.id;
    const ex = exprAt(a,t);
    const mo = a.mouth;
    const syl = Math.abs(Math.sin(t*(11+a.top%5)))*(0.55+0.45*Math.abs(Math.sin(t*4.3+a.top)));
    const open = talk ? Math.min(1, 0.12+0.85*syl+ex.o*0.5) : ex.o*0.5;
    mo.setAttribute("d", mouthD(+mo.dataset.cx, +mo.dataset.cy, +mo.dataset.w, ex.s, open));
    const bl = ((t+a.top*0.01)%3.6) < 0.14 ? 0.08 : 1; a.eyes.style.transform = "scaleY("+bl+")";
    [[a.browL,-1],[a.browR,1]].forEach(([b,sg]) => { const bx=+b.dataset.bx, by=+b.dataset.by;
      b.setAttribute("transform","translate(0 "+(-ex.r + (talk? -1.5*syl:0))+") rotate("+(sg*ex.t)+" "+bx+" "+by+")"); });
    const sw = talk ? 2.4*Math.sin(t*3.1)+1.2*Math.sin(t*7.3) : 1.3*Math.sin(t*0.9+a.top);
    const bob = talk ? -2*syl : 0;
    const hx=+a.head.dataset.hx, hy=+a.head.dataset.hy;
    a.head.setAttribute("transform","rotate("+(sw+(ex.t>5?3:0))+" "+hx+" "+hy+") translate(0 "+bob+")");
    const spk = D.dialogue.find(d => t>=d.start && t<d.end);
    let lx = 0; if (!talk && spk){ const other = actors.find(o => o.id===spk.character); if (other) lx = Math.max(-1,Math.min(1,(other.cx-a.cx)/500)); }
    else if (!talk) lx = (960-(a.cx+130))/900;
    a.pupils.forEach(p => p.setAttribute("transform","translate("+(lx*3.2)+" "+(talk?0:0.5)+")"));
    a.body.setAttribute("transform","translate(0 "+(1.6*Math.sin(t*1.9+a.top))+")");
    let ang;
    if (a.id === "teacher") ang = (talk && (boardNow || quizNow || kidsNow.length)) ? -98+7*Math.sin(t*3.5) : 4*Math.sin(t*1.1);
    else if (a.id === "inna") ang = casting ? -22+18*Math.sin(t*9) : (talk ? 10*Math.sin(t*6) : 4*Math.sin(t*2));
    else ang = talk ? -18+10*Math.sin(t*5) : 3*Math.sin(t*1.5);
    a.armR.setAttribute("transform", "rotate("+ang+" "+a.armR.dataset.px+" "+a.armR.dataset.py+")");
    a.armL.setAttribute("transform", "rotate("+(3*Math.sin(t*1.3))+" "+a.armL.dataset.px+" "+a.armL.dataset.py+")");
    if (a.glow){ a.glow.setAttribute("opacity",(0.45+0.25*Math.sin(t*5)).toFixed(3)); a.glow.setAttribute("r", casting ? 44 : 30); }
  });

  // ---- السبورة ----
  if (boardNow !== curBoard){ curBoard = boardNow; if (boardNow) buildBoard(boardNow); else $("sentence").innerHTML = ""; }
  if (boardNow && !quizNow){
    const p = clamp((t-boardNow.start)/0.35), e = easeOut(p);
    const s = $("sentence"); s.style.opacity = p; s.style.transform = "scale("+(0.92+0.08*e)+")";
    const base = boardNow.status === "wrong" ? RED : INK;
    s.querySelectorAll(".word").forEach(w => { w.style.color = base; w.lastChild.style.opacity = 0; });
    D.highlights.forEach(h => {
      if (t>=h.start && t<h.end){
        s.querySelectorAll(".word").forEach(w => {
          if (w.dataset.t === h.text){
            const c = roleColor(h.role); w.style.color = c;
            if (h.tag){ w.lastChild.textContent = h.tag; w.lastChild.style.setProperty("--c", c); w.lastChild.style.opacity = clamp((t-h.start)/0.4); }
          }
        });
      }
    });
  } else $("sentence").style.opacity = 0;

  // ---- شارة ✓ / ✗ ----
  const bd = D.badges.find(b => t>=b.start && t<b.end);
  if (bd){
    const p = clamp((t-bd.start)/0.35), sc = p<1 ? 0.2+1.0*easeOut(p)+0.12*Math.sin(p*Math.PI) : 1.0;
    $("badge").style.opacity = clamp((t-bd.start)/0.12); $("badge").style.transform = "scale("+sc+")";
    $("badgeBg").setAttribute("fill", bd.kind === "wrong" ? "#d64541" : "#2ea44f");
    $("badgePath").setAttribute("d", bd.kind === "wrong" ? "M30,30 L70,70 M70,30 L30,70" : "M28,52 L44,68 L74,34");
  } else $("badge").style.opacity = 0;

  // ---- التمرين ----
  if (quizNow !== curQuiz){ curQuiz = quizNow; if (quizNow) buildQuiz(quizNow); $("quiz").style.display = quizNow ? "block" : "none"; }
  if (quizNow){
    const cards = $("quiz").querySelectorAll(".opt"), revealed = t >= quizNow.reveal;
    cards.forEach((c,i) => { c.classList.toggle("correct", revealed && i === quizNow.answer);
      c.classList.toggle("dim", revealed && i !== quizNow.answer);
      c.querySelector(".ck").style.opacity = (revealed && i === quizNow.answer) ? 1 : 0; });
    const cd = $("quiz").querySelector(".cd");
    const k = 3 - Math.floor(t - quizNow.countdown_from);
    if (t >= quizNow.countdown_from && k >= 1 && !revealed){ cd.style.display = "flex"; cd.textContent = DIGITS[k]; } else cd.style.display = "none";
  }

  // ---- شرارات ----
  if (AI){
    const sr = $("sentence").getBoundingClientRect();
    const sx = sr.left + sr.width/2, sy = sr.top + sr.height/2;
    const wandX = AI.cx + 226, wandY = AI.cy + 254;
    sparks.forEach(k => {
      const p = (t-k.t0)/k.dur;
      if (p<0 || p>1){ k.el.setAttribute("opacity","0"); return; }
      let x,y;
      if (k.kind === "toWord"){ x = lerp(wandX,sx,easeOut(p)); y = lerp(wandY,sy,easeOut(p)) - Math.sin(p*Math.PI)*70*(rnd(k.s)-.5)*2; }
      else if (k.kind === "trail"){ x = AI.cx+120 - 50*p*(1+rnd(k.s)); y = AI.cy+420 - 120*p - rnd(k.s+1)*80; }
      else { x = AI.cx+130+(rnd(k.s)-.5)*260; y = AI.cy+120+(rnd(k.s+1)-.5)*320 - 40*p; }
      k.el.setAttribute("transform","translate("+x+" "+y+") rotate("+(p*160*(rnd(k.s)>.5?1:-1))+") scale("+(Math.sin(p*Math.PI)*k.size)+")");
      k.el.setAttribute("opacity",(0.95*Math.sin(p*Math.PI)).toFixed(3));
    });
  }

  // ---- الترجمة المكتوبة ----
  const ln = lineAt(t), cap = $("caption");
  if (ln){ $("capName").textContent = D.names[ln.character]; $("capText").textContent = ln.text;
    $("capText").style.color = ln.character === "inna" ? "#ffd166" : "#ffffff";
    cap.style.opacity = Math.min(clamp((t-ln.start)/0.15), clamp((ln.end-t)/0.15)); } else cap.style.opacity = 0;

  // ---- ظهور وتلاشٍ ----
  let f = 1 - clamp(t/0.3);
  if (D.fadeOut) f = Math.max(f, clamp((t-(D.duration-0.7))/0.7));
  $("fade").style.opacity = f;
}
window.renderAt = renderAt;
window.ready = document.fonts.ready.then(() => { renderAt(0); return true; });
</script>
